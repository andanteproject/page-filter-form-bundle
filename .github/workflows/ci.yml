name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Explicit PHP × Symfony pairs (each LTS/minor tested with a compatible PHP)
        include:
          - php-version: '7.4'
            symfony-version: '4.4.*'
          - php-version: '7.4'
            symfony-version: '5.4.*'
          - php-version: '8.2'
            symfony-version: '6.4.*'
          - php-version: '8.5'
            symfony-version: '7.0.*'
          - php-version: '8.5'
            symfony-version: '8.1.*'

    name: PHP ${{ matrix.php-version }} · SF ${{ matrix.symfony-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, json
          coverage: ${{ matrix.php-version == '8.5' && matrix.symfony-version == '7.0.*' && 'pcov' || 'none' }}

      - name: Constrain Symfony version
        run: |
          sed -ri 's/"symfony\/([^"]+)": "[^"]+"/"symfony\/\1": "${{ matrix.symfony-version }}"/g' composer.json

      - name: Relax php-cs-fixer for Symfony 4.4
        if: matrix.symfony-version == '4.4.*'
        run: |
          sed -ri 's/"friendsofphp\/php-cs-fixer": "\^3\.58"/"friendsofphp\/php-cs-fixer": "\^3.0"/' composer.json

      - name: Drop roave/security-advisories on PHP 7.4
        # roave/security-advisories conflicts with every PHP release below the
        # current security baseline (php <8.2.36|>=8.3,<8.3.37|...), so it can
        # never be installed on the EOL PHP 7.4 this bundle still supports.
        if: matrix.php-version == '7.4'
        run: composer remove --dev roave/security-advisories --no-update

      - name: Allow EOL Symfony 4.4 advisories
        # Symfony 4.4 reached EOL in Nov 2023 and symfony/http-kernel 4.4.x
        # carries advisories that will never be fixed, so Composer 2.11+ refuses
        # to install it. This row only checks library compatibility and deploys
        # nothing, so the block is turned off here and nowhere else.
        if: matrix.symfony-version == '4.4.*'
        run: composer config policy.advisories.block false

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--prefer-dist --no-progress --no-interaction --optimize-autoloader"

      - name: Run PHP-CS-Fixer
        if: matrix.php-version == '8.5' && matrix.symfony-version == '7.0.*'
        run: vendor/bin/php-cs-fixer fix --dry-run --stop-on-violation --using-cache=no

      - name: Run PHPStan
        if: matrix.php-version == '8.5' && matrix.symfony-version == '7.0.*'
        run: vendor/bin/phpstan analyse src tests --configuration=phpstan.neon --memory-limit=1G

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit ${{ matrix.php-version == '8.5' && matrix.symfony-version == '7.0.*' && '--coverage-clover coverage.xml' || '' }}

      - name: Upload coverage to Codecov
        if: matrix.php-version == '8.5' && matrix.symfony-version == '7.0.*'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
